[global]
   workgroup = EMPRESA
   server string = Servidor de archivos
   server role = standalone server
   security = user
   map to guest = never
   restrict anonymous = 2

   # Solo escuchar en localhost y en la red Host-Only (red.env)
   interfaces = lo enp0s8
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.56.0/24
   hosts deny = ALL

   server min protocol = SMB2
   smb encrypt = desired

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   log file = /var/log/samba/log.%m
   max log size = 1000

[soporte-iot]
   comment = Soporte IoT
   path = /srv/empresa/soporte-iot
   valid users = @soporte-iot @sistemas
   read only = no
   browseable = yes
   force group = soporte-iot
   create mask = 0660
   directory mask = 2770
   force create mode = 0660
   force directory mode = 2770

